const u=(x)=>Uint8Array.from(atob(x),(k)=>k.charCodeAt(0));
async function open(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));return new TextDecoder().decode(pt);}
async function go(pw){const h=await open(pw);try{sessionStorage.setItem('hubpw',pw)}catch(_){}document.open();document.write(h);document.close();}
const f=document.getElementById('f'),p=document.getElementById('p'),e=document.getElementById('e');
f.addEventListener('submit',async(ev)=>{ev.preventDefault();e.textContent='';try{await go(p.value)}catch(_){e.textContent='Wrong password';p.select()}});
(async()=>{let s=null;try{s=sessionStorage.getItem('hubpw')}catch(_){}
if(s){try{await go(s);return}catch(_){try{sessionStorage.removeItem('hubpw')}catch(__){}}}
f.hidden=false;p.focus();})();
